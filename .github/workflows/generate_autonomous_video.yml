name: Generate Autonomous Cinema Video

on:
  workflow_dispatch:
    inputs:
      movie:
        description: 'Specific film title (e.g. "The Matrix Reloaded", "Whiplash" - leave empty for catalog auto-pick)'
        required: false
        default: ''
        type: string
      scene:
        description: 'Specific scene or psychological concept (Optional - leave empty for auto-ideation)'
        required: false
        default: ''
        type: string
      upscale_8k:
        description: 'Render in 8K Super-Resolution (4320x7680) (Default: true)'
        required: false
        default: true
        type: boolean
      upload_youtube:
        description: 'Publish directly to YouTube (Default: true)'
        required: false
        default: true
        type: boolean
      privacy_status:
        description: 'YouTube privacy status'
        required: false
        default: 'unlisted'
        type: choice
        options:
          - 'unlisted'
          - 'public'
          - 'private'

concurrency:
  group: cinema-xray-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  produce_video:
    name: Autonomous Executive Producer & Video Engine
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Tools & Subtitle Fonts
        run: |
          echo "=== Installing FFmpeg & Subtitle Fonts ==="
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-liberation fonts-dejavu-core
          ffmpeg -version | head -n 2
          fc-cache -f

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: Hydrate YouTube Credentials from Secrets
        env:
          YOUTUBE_CLIENT_SECRETS_CONTENT: ${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}
          YOUTUBE_TOKEN_CONTENT: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          mkdir -p credentials config
          if [ -n "$YOUTUBE_CLIENT_SECRETS_CONTENT" ]; then
            printf "%s" "$YOUTUBE_CLIENT_SECRETS_CONTENT" > credentials/client_secrets.json
            cp credentials/client_secrets.json config/client_secrets.json
            echo "✅ client_secrets.json restored"
          else
            echo "⚠️ YOUTUBE_CLIENT_SECRETS_JSON secret not found in repository settings."
          fi

          if [ -n "$YOUTUBE_TOKEN_CONTENT" ]; then
            printf "%s" "$YOUTUBE_TOKEN_CONTENT" > credentials/token.json
            cp credentials/token.json config/youtube_token.json
            echo "✅ token.json restored"
          else
            echo "⚠️ YOUTUBE_TOKEN_JSON secret not found in repository settings."
          fi

          # Fast pre-flight check for YouTube token freshness
          python3 -c "
          from pathlib import Path
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          p = Path('credentials/token.json')
          if p.exists() and p.stat().st_size > 10:
              try:
                  c = Credentials.from_authorized_user_file(str(p))
                  if c.expired and c.refresh_token:
                      c.refresh(Request())
                      print('✅ Pre-Flight Auth: YouTube Token refreshed & valid!')
                  elif c.valid:
                      print('✅ Pre-Flight Auth: YouTube Token is valid!')
              except Exception as e:
                  print(f'⚠️ Pre-Flight Auth Warning: {e}')
          "

      - name: Execute Autonomous Production Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          PYTHONUNBUFFERED: "1"
        run: |
          echo "=== Running Autonomous Cinema Production ==="
          if [ -n "$YOUTUBE_COOKIES" ]; then
            echo "$YOUTUBE_COOKIES" > cookies.txt
            echo "✅ Configured YouTube authentication cookies"
          fi

          CMD_ARGS=""
          if [ -n "${{ inputs.movie }}" ]; then
            CMD_ARGS="--movie '${{ inputs.movie }}'"
            if [ -n "${{ inputs.scene }}" ]; then
              CMD_ARGS="$CMD_ARGS --scene '${{ inputs.scene }}'"
            fi
          else
            CMD_ARGS="--auto"
          fi

          if [ "${{ inputs.upscale_8k }}" == "false" ]; then
            CMD_ARGS="$CMD_ARGS --no-8k"
          fi

          if [ "${{ inputs.upload_youtube }}" == "true" ]; then
            CMD_ARGS="$CMD_ARGS --upload-youtube --privacy '${{ inputs.privacy_status }}'"
          fi

          echo "Command to execute: python3 run_autonomous_cinema.py $CMD_ARGS"
          eval python3 run_autonomous_cinema.py $CMD_ARGS
          rm -f cookies.txt

      - name: Upload Video Deliverables as GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cinema-decoded-deliverables
          path: |
            output/final_video/*.mp4
            projects/*/out/*.mp4
            output/thumbnails_short/*.jpg
            projects/*/brief.md
            projects/*/scene_plan.json
            projects/*/qc_frames/*.jpg
          if-no-files-found: warn
          retention-days: 14

      - name: Publish Summary to GitHub Job Summary
        if: always()
        run: |
          echo "## 🎬 Cinema Decoded Production Summary" >> $GITHUB_STEP_SUMMARY
          python3 -c "
          import json, os
          from pathlib import Path
          summary = []
          p = Path('database/completed_topics.json')
          if p.exists():
              try:
                  data = json.loads(p.read_text())
                  topics = data.get('topics', [])
                  if topics:
                      latest = topics[-1]
                      summary.append(f\"- **Movie**: {latest.get('movie_name', 'N/A')}\")
                      summary.append(f\"- **Title**: {latest.get('title', 'N/A')}\")
                      summary.append(f\"- **Core Thesis**: {latest.get('core_thesis', 'N/A')}\")
                      yt = latest.get('youtube_url')
                      if yt:
                          summary.append(f\"- **YouTube Link**: [{yt}]({yt})\")
                      else:
                          summary.append(\"- **YouTube Link**: Upload skipped or pending\")
              except Exception as e:
                  summary.append(f'Summary note: {e}')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('\n'.join(summary) + '\n')
          "

      - name: GitOps Commit & Push Updated Topics Database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add database/ projects/*/brief.md projects/*/scene_plan.json projects/*/script.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore(database): record completed cinema topic [skip ci]"
            for attempt in 1 2 3 4 5; do
              echo "Attempt $attempt to push database changes to origin/main..."
              if git push origin HEAD:main; then
                echo "✅ Successfully pushed database changes to origin/main"
                break
              fi
              echo "⚠️ Push rejected on attempt $attempt. Pulling and rebasing..."
              git fetch origin main
              git rebase origin/main || (git rebase --abort && git merge -X theirs origin/main -m "Merge remote main")
              sleep 3
            done
          else
            echo "Database unchanged."
          fi
